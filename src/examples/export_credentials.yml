description: >
  Export the forge/ci profile's credentials for the whole job and persist them
  for subsequent steps.

  The forge/ci profile is first configured with the circleci/aws-cli orb.
  aws/export_credentials materializes its credentials via
  `aws configure export-credentials` and writes them into BASH_ENV, so every
  following step in the job runs with them.

usage:
  version: 2.1
  orbs:
    aws-cli: circleci/aws-cli@5.4.1
    aws: rynkowsg/aws@0.1.0

  jobs:
    deploy:
      docker: [{image: "cimg/base:2026.04"}]
      steps:
        # configure the profile whose credentials will be exported
        - aws-cli/setup:
            profile_name: forge/ci
            role_arn: "arn:aws:iam::${FORGE_ACCOUNT_ID}:role/ci/deployer-role"
            set_aws_env_vars: false
        # export the profile's credentials to BASH_ENV
        - aws/export_credentials:
            profile: forge/ci
        # subsequent steps run with the exported credentials
        - run: aws sts get-caller-identity

  workflows:
    test:
      jobs:
        - deploy
