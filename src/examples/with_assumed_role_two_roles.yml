description: >
  Run a build step under the builder role and a deploy step under the deployer
  role within a single job.

  An OIDC source profile is first configured with the circleci/aws-cli orb.
  Each aws/with_assumed_role step assumes its own role via `aws sts assume-role`
  and runs the command with the temporary credentials in scope. Nothing is
  written to BASH_ENV, so each role's credentials stay scoped to its own step.

usage:
  version: 2.1
  orbs:
    aws-cli: circleci/aws-cli@5.4.1
    aws: rynkowsg/aws@1.0.0

  jobs:
    build_and_deploy:
      docker: [{image: "cimg/base:2026.04"}]
      steps:
        # configure an OIDC source profile allowed to call sts:AssumeRole
        - aws-cli/setup:
            profile_name: identity/oidc-circleci
            role_arn: "arn:aws:iam::${IDENTITY_ACCOUNT_ID}:role/oidc/circleci-role"
            role_session_name: "circleci-${CIRCLE_WORKFLOW_ID}"
            set_aws_env_vars: false
        # assume the builder role for one step
        - aws/with_assumed_role:
            source_profile: identity/oidc-circleci
            role_arn: "arn:aws:iam::${FORGE_ACCOUNT_ID}:role/ci/builder-role"
            command: "aws sts get-caller-identity"
        # assume the deployer role for another step
        - aws/with_assumed_role:
            source_profile: identity/oidc-circleci
            role_arn: "arn:aws:iam::${FORGE_ACCOUNT_ID}:role/ci/deployer-role"
            command: "aws sts get-caller-identity"

  workflows:
    test:
      jobs:
        - build_and_deploy
