version: 2.1

orbs:
  # orb under test
  aws: {}
  # orb info: https://circleci.com/developer/orbs/orb/circleci/orb-tools
  # changelog: https://github.com/CircleCI-Public/orb-tools-orb/releases
  orb-tools: circleci/orb-tools@12.5.0

# Every branch and every tag. Tags have to be named: a job with no tag filter is
# skipped when a tag is pushed, and the publish jobs below require these, so on a
# release tag they would have nothing to wait for.
run_always: &run_always
  branches: {only: '/.*/'}
  tags: {only: '/.*/'}

# Only a release tag, never a branch.
run_on_release: &run_on_release
  branches: {ignore: '/.*/'}
  tags: {only: '/^v[0-9]+\.[0-9]+\.[0-9]+$/'}

# NOTE: This orb has no integration test job. Its commands assume AWS roles and
# export profile credentials, which would require a real AWS account and an
# OIDC/identity setup to exercise end to end. The orb is therefore validated by
# the static checks in config.yml (lint, shellcheck, orb-tools/lint+review) and
# packed/published here.

workflows:
  test-deploy:
    jobs:
      - orb-tools/pack:
          filters: *run_always

      - orb-tools/publish:
          name: publish-dev
          orb_name: rynkowsg/aws
          vcs_type: <<pipeline.project.type>>
          pub_type: dev
          requires:
            - orb-tools/pack
          context: circleci/orb-publishing-context
          filters: *run_always

      - orb-tools/publish:
          name: publish-prod
          orb_name: rynkowsg/aws
          vcs_type: <<pipeline.project.type>>
          pub_type: production
          requires:
            - publish-dev
          context: circleci/orb-publishing-context
          filters: *run_on_release
